function now(){return new Date().toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function dateOffset(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');return s?merge(defaults,s):structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function merge(a,b){const out={...a,...b};for(const k of Object.keys(a)){if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])&&b[k])out[k]={...a[k],...b[k]};else if(Array.isArray(a[k])&&!Array.isArray(b[k]))out[k]=a[k]}return out}
function save(action,detail){localStorage.setItem(STORE,JSON.stringify(state));if(action)state.audit.unshift({id:id(),action,actor:state.settings.displayName||'Workspace user',time:now(),detail:detail||''});localStorage.setItem(STORE,JSON.stringify(state));}
function id(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:state.settings.currency||'USD'}).format(Number(n)||0)}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2800)}
function setPage(p){page=p;document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('sidebar').classList.remove('open');render();$('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
function head(title,desc,actions=''){return '<div class="page-head"><div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="head-actions">'+actions+'<button class="icon-btn gear" data-gear="'+page+'" title="Customize this page" aria-label="Customize '+title+'">⚙</button></div></div>'}
function card(title,body,opts={}){return '<section class="card"><div class="card-head"><div><h2>'+title+'</h2>'+(opts.sub?'<p>'+opts.sub+'</p>':'')+'</div>'+(opts.gear===false?'':'<button class="icon-btn gear" data-gear="'+(opts.key||page)+'" title="Customize '+title+'" aria-label="Customize '+title+'">⚙</button>')+'</div><div class="card-body">'+body+'</div></section>'}
function metric(label,value,note,icon){return '<section class="card metric"><span class="symbol">'+icon+'</span><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="note">'+note+'</div></section>'}
function btn(label,action,cls=''){return '<button class="btn '+cls+'" data-action="'+action+'">'+label+'</button>'}
function field(label,name,value,type='text',extra=''){return '<div class="field"><label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value??'')+'" '+extra+'></div>'}
function selectField(label,name,value,options){return '<div class="field"><label for="'+name+'">'+label+'</label><select id="'+name+'">'+options.map(o=>'<option '+(o[0]===value?'selected':'')+' value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select></div>'}

function homePage(){const open=state.tickets.filter(t=>t.status!=='Resolved'&&t.status!=='Closed').length;return head('Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening')+', '+esc((state.settings.displayName||'there').split(' ')[0])+'.','Your connected workspace for people, work, and operations.',btn('Create event','new-event','primary')+' '+btn('New ticket','new-ticket') )+'<section class="hero"><span class="status">COMMAND CENTER · FRONT-END PREVIEW</span><h2>One World, One System, One Intelligent Network.</h2><p>Bring your tools, teams, workflows, and decisions into one configurable workspace. Use the gear icons to customize each page; demo records are stored in this browser.</p><div class="row wrap">'+btn('Open calendar','goto-calendar','primary')+btn('Start a chat','goto-chat')+btn('Explore marketplace','goto-marketplace')+'</div></section><section class="card" style="margin-top:14px;border-left:4px solid var(--blue)"><div class="card-head"><div><h2>Company Announcements</h2><p>Official updates for your organization</p></div><button class="btn soft" data-goto="announcements">View all</button></div><div class="card-body"><b>Welcome to the Command Center pilot</b><p>This is illustrative sample content. Company administrators will be able to publish company and department updates with links to approved resources.</p><button class="btn primary" data-goto="announcements">Open Company Communications</button></div></section><section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Global Clock</h2><p>Global time-zone display</p></div><span class="status">Preview</span></div><div class="card-body"><div class="grid g3"><div><b>Chicago</b><div class="small muted">Local time-zone preview</div></div><div><b>London</b><div class="small muted">Integration planned</div></div><div><b>Tokyo</b><div class="small muted">Integration planned</div></div></div></div></section><section class="card" style="margin-top:14px"><div function calendarPage(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),today=dateOffset(0);let cells='';for(let i=0;i<start;i++)cells+='<div class="day-cell"></div>';for(let d=1;d<=days;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),events=state.events.filter(e=>e.date===ds);cells+='<div class="day-cell '+(ds===today?'today':'')+'"><div class="row between"><span class="day-number">'+d+'</span><button class="icon-btn" style="width:22px;height:22px;font-size:14px" data-add-date="'+ds+'" title="Add event">+</button></div>'+events.map(e=>'<button class="event-chip" data-edit-event="'+e.id+'" title="'+esc(e.time+' '+e.title)+'">'+esc(e.time+' '+e.title)+'</button>').join('')+'</div>'}return head(state.settings.title_calendar||'IntelliCalendar','Schedule meetings, appointments, focus blocks, and project milestones.',btn('＋ New event','new-event','primary'))+'<section class="card"><div class="card-head"><div class="calendar-toolbar"><button class="icon-btn" data-month="-1">‹</button><button class="btn soft" data-month="0">Today</button><button class="icon-btn" data-month="1">›</button><h2>'+calendarDate.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</h2></div><button class="icon-btn gear" data-gear="calendar">⚙</button></div><div class="calendar-scroll"><div class="calendar-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="day-head">'+d+'</div>').join('')+cells+'</div></div><div class="card-body"><div class="row between wrap"><b>Upcoming events</b><span class="small muted">'+state.events.length+' saved event(s)</span></div>'+state.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>'<div class="row between wrap" style="padding:11px 0;border-bottom:1px solid #e8f0f5"><div><b>'+esc(e.title)+'</b><div class="small muted">'+esc(e.date)+' · '+esc(e.time)+'–'+esc(e.end)+' · '+esc(e.owner)+'</div></ function knowledgePage(){return head('Knowledge Base','Create and maintain guides, runbooks, FAQs, and approved procedures.',btn('＋ New article','new-doc','primary'))+'<div class="notice">Knowledge articles shown here are local sample content. They are not yet connected to the Supabase knowledge base.</div><section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Articles &amp; runbooks</h2><p>'+state.docs.length+' document(s)</p></div><button class="icon-btn gear" data-gear="knowledge">⚙</button></div><div class="card-body">'+state.docs.map(d=>'<div class="row between wrap" style="padding:12px 0;border-bottom:1px solid #e6eff5"><div><b>'+esc(d.name)+'</b><div class="small muted">'+esc(d.type)+' · '+esc(d.folder)+' · Updated '+esc(d.updated)+'</div></div><div class="row">'+btn('Open','open-doc:'+d.id,'soft')+'<button class="icon-btn" data-delete-doc="'+d.id+'">×</button></div></div>').join('')+'</div></section>'}
function payPage(){const total=state.payments.reduce((s,p)=>s+Number(p.amount),0);return head('IntelliPay','Payment operations workspace · no payment processor is connected.',btn('＋ Record test transaction','new-payment','primary'))+'<div class="notice warn">Demo mode: entries below are local records only. This page does not move money, collect card data, or connect to a payment provider.</div><div class="grid g3" style="margin-top:14px">'+metric('Recorded transactions',state.payments.length,'Local ledger','▤')+metric('Recorded volume',money(total),'Not a bank balance','＄')+metric('Processor status','Not connected','Configure an approved connector','⌘')+'</div><div class="grid g2" style="margin-top:14px">'+card('Payment activity',state.payments.length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+state.payments.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.ref)+'</td><td>'+esc(p.customer)+'</td><td>'+money(p.amount)+'</td><td>'+pill(p.status,p.status==='Test recorded'?'warn':'')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No transactions recorded. Add a clearly labeled test entry to exercise the UI.</div>',{key:'pay'})+card('Payment workflow', '<div class="setting-row"><div><b>1. Create payment intent</b><div class="small muted">Backend provider integration required</div></div>'+pill('Not connected','warn')+'</div><div class="setting-row"><div><b>2. Confirm payment</b><div class="small muted">Provider confirmation and idempotency required</div></div>'+pill('Not connected','warn')+'</div><div class="setting-row"><div><b>3. Reconcile &amp; audit</b><div class="small muted">Use provider webhooks and server-side ledger</div></div>'+pill('Not connected','warn')+'</div>',{key:'pay'})+'</div>'}
function taxPage(){const total=state.taxItems.reduce((s,t)=>s+Number(t.income),0),rate=Number(state.settings.demoTaxRate??22),estimated=total*rate/100;return head('IntelliTax','Organize tax records and run illustrative estimates. Not tax advice or filing.',btn('＋ Add tax record','new-tax','primary'))+'<div class="notice warn">Estimates are illustrative only. No tax returns are prepared or filed, and no jurisdiction-specific tax rules are applied.</div><div class="grid g3" style="margin-top:14px">'+metric('Records',state.taxItems.length,'Local tax workspace','▤')+metric('Income entered',money(total),'User-entered sample values','＄')+metric('Illustrative estimate',money(estimated),'At '+rate+'% demo rate','≈')+'</div><div class="grid g2" style="margin-top:14px">'+card('Estimate controls','<div class="field"><label for="taxRate">Illustrative rate (%)</label><input id="taxRate" type="number" min="0" max="100" step=".1" value="'+rate+'"></div><p class="small muted">This simple percentage is not a tax calculation. Update it to test the interface.</p><div class="tax-result" id="taxEstimate">'+money(estimated)+'</div>',{key:'tax'})+card('Tax records',state.taxItems.length?'<div class="table-wrap"><table><thead><tr><th>Period</th><th>Type</th><th>Description</th><th>Amount</th><th></th></tr></thead><tbody>'+state.taxItems.map(t=>'<tr><td>'+esc(t.period)+'</td><td>'+esc(t.kind)+'</td><td>'+esc(t.description)+'</td><td>'+money(t.income)+'</td><td><button class="icon-btn" data-delete-tax="'+t.id+'">×</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Add income or expense records to test the tax workspace.</div>',{key:'tax'})+'</div>'}
function marketplacePage(){return head('IntelliStack Marketplace','Browse the local catalog preview. Live prices and purchasing require backend approval.',btn('＋ Add catalog item','new-product','primary'))+'<div class="notice warn">This catalog is a front-end sample, not a live mirror of Supabase yet. Unreviewed products and unconfigured prices are clearly marked.</div><div class="toolbar" style="margin-top:14px"><input class="control" id="productSearch" placeholder="Search catalog…" style="max-width:280px"><select class="control" id="productCategory" style="max-width:200px"><option value="">All categories</option>'+[...new Set(state.products.map(p=>p.category))].map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div><div class="grid g3" id="productGrid">'+productCards(state.products)+'</div>'}

function reportsPage(){return head('Reports & Audit','Local activity log and summary of browser-side changes.',btn('Export audit CSV','export-audit','primary'))+'<div class="grid g3">'+metric('Audit entries',state.audit.length,'Local events','▤')+metric('Profiles',state.people.length,'Sample profiles','♙')+metric('Work items',state.tickets.length,'Sample tickets','▤')+'</div><section class="card" style="margin-top:14px"><div class="card-head"><h2>Audit activity</h2><button class="icon-btn gear" data-gear="reports">⚙</button></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>'+state.audit.map(a=>'<tr><td>'+esc(a.time)+'</td><td>'+esc(a.actor)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td></tr>').join('')+'</tbody></table></div></section>'}
function settingsPage(){const s=state.settings;return head('Settings & Theme Studio','Customize workspace identity, appearance, defaults, and local demo data.',btn('Export local data','export-json','primary')+' '+btn('Reset demo','reset-demo','danger'))+'<div class="grid g2">'+card('Workspace identity','<div class="form-grid">'+field('Organization name','sOrg',s.orgName)+field('Security slogan','sTag',s.tagline)+field('Display name','sName',s.displayName)+field('Job title','sTitle',s.jobTitle)+field('Department','sDept',s.department)+field('Work email','sEmail',s.email,'email')+'</div><div class="row" style="margin-top:12px">'+btn('Save identity','save-identity','primary')+'</div>',{key:'settings'})+card('Appearance & preferences',selectField('Accent theme','sTheme',s.theme,[['blue','Blue / Sky'],['indigo','Indigo'],['teal','Teal'],['violet','Violet']])+selectField('Currency display','sCurrency',s.currency,[['USD','USD — US Dollar'],['EUR','EUR — Euro'],['GBP','GBP — Pound'],['CAD','CAD — Canadian Dollar']])+selectField('Week starts on','sWeek',s.weekStart,[['Sunday','Sunday'],['Monday','Monday']])+selectField('Fiscal year begins','sFiscal',s.fiscalYear,[['January','January'],['April','April'],['July','July'],['October','October']])+'<div class="setting-row"><div><b>Compact spacing</b><div class="small muted">Fit more content on screen</div></div><button class="toggle '+(s.compact?'on':'')+'" data-toggle="compact" aria-label="Toggle compact spacing"></button></div><div class="setting-row"><div><b>Card shadows</b><div class="small muted">Soft depth on cards</div></div><button class="toggle '+(s.shadows?'on':'')+'" data-toggle="shadows" aria-label="Toggle card shadows"></button></div><div class="row" style="margin-top:12px">'+btn('Save appearance','save-appearance','primary')+'</div>',{key:'settings'})+card('Data & privacy boundary','<p>All editable records in this prototype are stored in this browser’s local storage. They do not synchronize to other devices or users.</p><div class="row wrap">'+btn('Download backup','export-json','soft')+btn('Clear local data','clear-local','danger')+'</div>',{key:'settings'})+card('Module configuration','<p>Every module page has a gear icon for page-level preferences. Workspace settings apply global brand and display defaults.</p><div class="row wrap">'+btn('Customize current page','gear-current','soft')+btn('Open Connector Hub','goto-connectors')+'</div>',{key:'settings'})+'</div>'}
function notesPage(){return head('IntelliNotes','Create, edit, search, and archive working notes.',btn('＋ New note','new-note','primary'))+'<div class="grid g2">'+card('Notes library','<input class="control" id="noteSearch" placeholder="Search notes…">'+state.notes.map(n=>'<article style="padding:12px 0;border-bottom:1px solid #e6eff5"><div class="row between"><b>'+esc(n.title)+'</b><button class="icon-btn" data-edit-note="'+n.id+'">✎</button></div><p class="small">'+esc(n.body)+'</p><small class="muted">'+esc(n.updated)+'</small></article>').join(''),{key:'notes'})+card('Note editor','<p class="muted">Choose a note to edit, or create a new note. Changes are saved locally.</p>'+btn('Create note','new-note','primary'),{key:'notes'})+'</div>'}
function editorPage(name,desc,kind){const doc=state.docs.find(d=>d.id==='editor-'+kind)||{content:'',name:'Untitled '+name};return head(name,desc,btn('Save document','save-editor','primary'))+card('Editor', '<div class="form-grid">'+field('Document title','editorTitle',doc.name)+selectField('Format','editorFormat','Draft',[['Draft','Draft'],['Review','Review'],['Approved','Approved']])+'</div><div class="field" style="margin-top:12px"><label for="editorContent">Content</label><textarea id="editorContent" style="min-height:360px">'+esc(doc.content)+'</textarea></div><div class="row between wrap" style="margin-top:12px"><span class="small muted">Local draft · export/collaboration integrations pending</span>'+btn('Download .txt','download-editor','soft')+'</div>',{key:kind})}
function sheetsPage(){return head('IntelliSheets','Editable spreadsheet-style grid with basic formula evaluation.',btn('＋ Add row','add-sheet-row','primary'))+card('Working sheet','<p class="small muted">Edit cells directly. Use =SUM(B2:B5) or =AVERAGE(B2:B5) in a cell for a basic local calculation.</p><div class="table-wrap"><table id="sheetTable"><thead><tr><th>Item</th><th>Amount</th><th>Notes</th></tr></thead><tbody>'+((state.sheetRows||[{a:'Hosting',b:'125',c:'Monthly estimate'},{a:'Storage',b:'40',c:'Monthly estimate'},{a:'Monitoring',b:'85',c:'Monthly estimate'}]).map((r,i)=>'<tr><td><input class="control" data-sheet="'+i+'" data-col="a" value="'+esc(r.a)+'"></td><td><input class="control" data-sheet="'+i+'" data-col="b" value="'+esc(r.b)+'"></td><td><input class="control" data-sheet="'+i+'" data-col="c" value="'+esc(r.c)+'"></td></tr>').join(''))+'</tbody><tfoot><tr><th>Total</th><th id="sheetTotal">'+money((state.sheetRows||[{b:125},{b:40},{b:85}]).reduce((s,r)=>s+(Number(r.b)||0),0))+'</th><th>Local calculation</th></tr></tfoot></table></div><div class="row" style="margin-top:12px">'+btn('Save sheet','save-sheet','primary')+'</div>',{key:'sheets'})}
function drivePage(){return head('IntelliDrive','Organize local document metadata and text drafts.',btn('＋ New file record','new-doc','primary'))+card('My files','<div class="table-wrap"><table><thead><tr><th>File / document</th><th>Type</th><th>Folder</th><th>Updated</th><th></th></tr></thead><tbody>'+state.docs.map(d=>'<tr><td>'+esc(d.name)+'</td><td>'+esc(d.type)+'</td><td>'+esc(d.folder)+'</td><td>'+esc(d.updated)+'</td><td><button class="icon-btn" data-open-doc="'+d.id+'">↗</button></td></tr>').join('')+'</tbody></table></div><p class="small muted">These are document records, not uploaded cloud files. Secure storage is not connected.</p>',{key:'drive'})}
function formsPage(){return head('IntelliForms','Build simple forms, preview them, and save local submissions.',btn('＋ New form','new-form','primary'))+card('Forms library',state.forms.length?state.forms.map(f=>'<div class="row between" style="padding:12px 0;border-bottom:1px solid #e6eff5"><div><b>'+esc(f.title)+'</b><div class="small muted">'+esc(f.description)+'</div></div>'+btn('Preview','form:'+f.id,'soft')+'</div>').join(''):'<div class="empty">No forms yet. Create a form to test the builder.</div>',{key:'forms'})}
function studioPage(){return head('IntelliStudio','Customize module presentation and draft reusable content.',btn('＋ New design brief','new-note','primary'))+'<div class="grid g2">'+card('Brand tokens','<div class="grid g2">'+[['Primary blue','#0755a5'],['Bright blue','#1678e8'],['Teal','#087f9d'],['Canvas','#f4f9fe']].map(c=>'<div class="row"><span style="width:28px;height:28px;border-radius:7px;background:'+c[1]+';border:1px solid #d1e3ee"></span><div><b>'+c[0]+'</b><div class="small muted">'+c[1]+'</div></div></div>').join('')+'</div><p class="small muted">Use Settings &amp; Theme Studio to change the active accent.</p>',{key:'studio'})+card('Design briefs',state.notes.map(n=>'<div style="padding:10px 0;border-bottom:1px solid #e6eff5"><b>'+esc(n.title)+'</b><p class="small muted">'+esc(n.body)+'</p></div>').join('')||'<p>No briefs yet.</p>',{key:'studio'})+'</div>'}
function textSafe(s){return esc(s)}
function wirePage(){
 document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));
 document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>gearModal(b.dataset.gear));
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.month);if(n===0)calendarDate=new Date();else calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+n,1);render()});
 document.querySelectorAll('[data-add-date]').forEach(b=>b.onclick=()=>eventModal(null,b.dataset.addDate));
 document.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>eventModal(b.dataset.editEvent));
 document.querySelectorAll('[data-delete-event]').forEach(b=>b.onclick=()=>{const e=state.events.find(x=>x.id===b.dataset.deleteEvent);if(e&&confirm('Delete event "'+e.title+'"?')){state.events=state.events.filter(x=>x.id!==e.id);save('Calendar event deleted',e.title);render()}});
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{activeChat=b.dataset.chat;render()});
 document.querySelectorAll('[data-rename-chat]').forEach(b=>b.onclick=()=>{const c=state.chats.find(x=>x.id===b.dataset.renameChat);const n=prompt('Conversation name',c.name);if(n&&n.trim()){c.name=n.trim();save('Chat renamed',c.name);render()}});
 $('chatForm')?.addEventListener('submit',e=>{e.preventDefault();const text=$('chatDraft').value.trim();if(!text)return;const c=state.chats.find(x=>x.id===activeChat);c.messages.push({id:id(),from:state.settings.displayName||'You',text,time:now()});save('Local chat message added',c.name);render();$('chatMessages')?.scrollTo(0,999999)});
 document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{const t=state.tasks.find(x=>x.id===b.dataset.task);if(t)t.done=b.checked;save('Checklist updated',t?.title);render()});
 document.querySelectorAll('[data-ticket-status]').forEach(s=>s.onchange=()=>{const t=state.tickets.find(x=>x.id===s.dataset.ticketStatus);if(t){t.status=s.value;t.updated=dateOffset(0);save('Ticket status changed',t.id+' → '+t.status);render();toast('Ticket updated locally')}});
 $('ticketSearch')?.addEventListener('input',filterTickets);$('ticketStatus')?.addEventListener('change',filterTickets);
 $('productSearch')?.addEventListener('input',filterProducts);$('productCategory')?.addEventListener('change',filterProducts);
 $('taxRate')?.addEventListener('input',()=>{state.settings.demoTaxRate=Math.min(100,Math.max(0,Number($('taxRate').value)||0));$('taxEstimate').textContent=money(state.taxItems.reduce((s,t)=>s+Number(t.income),0)*state.settings.demoTaxRate/100);save()});
 document.querySelectorAll('[data-delete-tax]').forEach(b=>b.onclick=()=>{state.taxItems=state.taxItems.filter(t=>t.id!==b.dataset.deleteTax);save('Tax record removed',b.dataset.deleteTax);render()});
 document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>productModal(b.dataset.editProduct));
 document.querySelectorAll('[data-delete-doc]').forEach(b=>b.onclick=()=>{state.docs=state.docs.filter(d=>d.id!==b.dataset.deleteDoc);save('Document record removed',b.dataset.deleteDoc);render()});
 document.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>noteModal(b.dataset.editNote));
 document.querySelectorAll('[data-open-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.openDoc));
 document.querySelectorAll('[data-edit-person]').forEach(b=>b.onclick=()=>personModal(b.dataset.editPerson));
 document.querySelectorAll('[data-war]').forEach(b=>b.onchange=()=>save('War Room checklist changed','step '+b.dataset.war+' '+b.checked));
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{state.settings[b.dataset.toggle]=!state.settings[b.dataset.toggle];save('Display preference changed',b.dataset.toggle);render()});
 document.querySelectorAll('[data-edit-ticket]').forEach(b=>b.onclick=()=>ticketModal(b.dataset.editTicket));
 document.querySelectorAll('[data-open-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.openDoc));
}
function filterTickets(){const q=($('ticketSearch')?.value||'').toLowerCase(),s=$('ticketStatus')?.value||'';$('ticketRows').innerHTML=ticketRows(state.tickets.filter(t=>(!s||t.status===s)&&JSON.stringify(t).toLowerCase().includes(q)));$('ticketRows').querySelectorAll('[data-ticket-status]').forEach(el=>el.onchange=()=>{const t=state.tickets.find(x=>x.id===el.dataset.ticketStatus);if(t){t.status=el.value;save('Ticket status changed',t.id);filterTickets()}});$('ticketRows').querySelectorAll('[data-edit-ticket]').forEach(el=>el.onclick=()=>ticketModal(el.dataset.editTicket))}
function filterProducts(){const q=($('productSearch')?.value||'').toLowerCase(),c=$('productCategory')?.value||'';$('productGrid').innerHTML=productCards(state.products.filter(p=>(!c||p.category===c)&&JSON.stringify(p).toLowerCase().includes(q)));$('productGrid').querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>productModal(b.dataset.editProduct));$('productGrid').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}
function filterSearch(){const q=searchQuery.toLowerCase();document.querySelectorAll('#main .card,#main .quick-card,#main .hero').forEach(el=>el.style.display=(!q||el.textContent.toLowerCase().includes(q))?'':'none')}
function openModal(title,body,buttons=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML='<button class="btn" id="modalCancel">Cancel</button>'+buttons.map((b,i)=>'<button class="btn '+(b.cls||'')+'" id="modalBtn'+i+'">'+b.label+'</button>').join('');$('modalBackdrop').classList.add('open');$('modalCancel').onclick=closeModal;buttons.forEach((b,i)=>$('modalBtn'+i).onclick=b.click);setTimeout(()=>$('modalBody').querySelector('input,textarea,select')?.focus(),50)}
function closeModal(){$('modalBackdrop').classList.remove('open')}
function eventModal(eventId,date){const e=state.events.find(x=>x.id===eventId)||{title:'',date:date||dateOffset(0),time:'09:00',end:'09:30',type:'Meeting',owner:state.settings.displayName,notes:''};openModal(eventId?'Edit calendar event':'Create calendar event','<div class="form-grid">'+field('Event title','evTitle',e.title)+field('Date','evDate',e.date,'date')+field('Start time','evTime',e.time,'time')+field('End time','evEnd',e.end,'time')+selectField('Type','evType',e.type,[['Meeting','Meeting'],['Focus','Focus time'],['Project','Project'],['Personal','Personal'],['Security','Security']])+field('Owner / organizer','evOwner',e.owner)+ '<div class="field full"><label for="evNotes">Notes</label><textarea id="evNotes">'+esc(e.notes)+'</textarea></div></div>',[{label:eventId?'Save changes':'Create event',cls:'primary',click:()=>{const title=$('evTitle').value.trim();if(!title||!$('evDate').value){toast('Title and date are required');return}const item={...e,id:e.id||id(),title,date:$('evDate').value,time:$('evTime').value,end:$('evEnd').value,type:$('evType').value,owner:$('evOwner').value,notes:$('evNotes').value};if(eventId)Object.assign(e,item);else state.events.push(item);save(eventId?'Calendar event updated':'Calendar event created',title);closeModal();render();toast('Event saved locally')}}])}
function ticketModal(ticketId){const t=state.tickets.find(x=>x.id===ticketId)||{id:'INC-'+(1043+state.tickets.length),title:'',priority:'Medium',status:'Open',owner:'Help Desk L1',requester:state.settings.displayName,updated:dateOffset(0)};openModal(ticketId?'Edit ticket':'Create ticket','<div class="form-grid">'+field('Ticket ID','tkId',t.id)+field('Title','tkTitle',t.title)+selectField('Priority','tkPriority',t.priority,[['Low','Low'],['Medium','Medium'],['High','High'],['Critical','Critical']])+selectField('Status','tkStatus',t.status,[['Open','Open'],['In progress','In progress'],['Waiting approval','Waiting approval'],['Resolved','Resolved'],['Closed','Closed']])+field('Owner','tkOwner',t.owner)+field('Requester','tkRequester',t.requester)+'</div>',[{label:'Save ticket',cls:'primary',click:()=>{const title=$('tkTitle').value.trim();if(!title){toast('Ticket title is required');return}Object.assign(t,{id:$('tkId').value.trim()||t.id,title,priority:$('tkPriority').value,status:$('tkStatus').value,owner:$('tkOwner').value,requester:$('tkRequester').value,updated:dateOffset(0)});if(!ticketId)state.tickets.unshift(t);save(ticketId?'Ticket updated':'Ticket created',t.id);closeModal();render()}}])}
function productModal(productId){const p=state.products.find(x=>x.id===productId)||{id:id(),name:'',category:'Productivity',description:'',price:0,priceLabel:'Pricing not configured',status:'Needs review'};openModal(productId?'Edit catalog item':'Add catalog item','<div class="form-grid">'+field('Product name','prName',p.name)+field('Category','prCat',p.category)+field('Price label (display only)','prPriceLabel',p.priceLabel)+selectField('Readiness','prStatus',p.status,[['Needs review','Needs review'],['Coming soon','Coming soon'],['Available','Available'],['Unavailable','Unavailable']])+'<div class="field full"><label for="prDesc">Description</label><textarea id="prDesc">'+esc(p.description)+'</textarea></div></div><p class="small muted">This front-end catalog does not enable checkout or set live prices.</p>',[{label:'Save catalog item',cls:'primary',click:()=>{p.name=$('prName').value.trim();if(!p.name){toast('Product name is required');return}p.category=$('prCat').value;p.priceLabel=$('prPriceLabel').value;p.status=$('prStatus').value;p.description=$('prDesc').value;if(!productId)state.products.push(p);save('Catalog item saved',p.name);closeModal();render()}}])}
function personModal(personId){const p=state.people.find(x=>x.id===personId)||{id:id(),name:'',role:'Employee',department:'',email:'',status:'Demo user'};openModal(personId?'Edit profile':'Add demo profile','<div class="form-grid">'+field('Name','peName',p.name)+field('Email','peEmail',p.email,'email')+field('Role label','peRole',p.role)+field('Department','peDept',p.department)+selectField('Status','peStatus',p.status,[['Active','Active'],['Demo user','Demo user'],['Inactive','Inactive']])+'</div><p class="small muted">Role labels are illustrative and do not enforce access permissions.</p>',[{label:'Save profile',cls:'primary',click:()=>{p.name=$('peName').value.trim();p.email=$('peEmail').value.trim();p.role=$('peRole').value;p.department=$('peDept').value;p.status=$('peStatus').value;if(!p.name){toast('Name is required');return}if(!personId)state.people.push(p);save('Profile record saved',p.name);closeModal();render()}}])}
function noteModal(noteId){const n=state.notes.find(x=>x.id===noteId)||{id:id(),title:'',body:'',updated:now()};openModal(noteId?'Edit note':'New note','<div class="field"><label for="ntTitle">Title</label><input id="ntTitle" value="'+esc(n.title)+'"></div><div class="field" style="margin-top:12px"><label for="ntBody">Content</label><textarea id="ntBody" style="min-height:220px">'+esc(n.body)+'</textarea></div>',[{label:'Save note',cls:'primary',click:()=>{n.title=$('ntTitle').value.trim()||'Untitled note';n.body=$('ntBody').value;n.updated=now();if(!noteId)state.notes.unshift(n);save('Note saved',n.title);closeModal();render()}}])}
function openDoc(docId){const d=state.docs.find(x=>x.id===docId);if(!d)return;openModal(d.name,'<div class="small muted">'+esc(d.type)+' · '+esc(d.folder)+'</div><div style="white-space:pre-wrap;margin-top:12px">'+esc(d.content||'No content yet.')+'</div>',[{label:'Edit',cls:'primary',click:()=>{closeModal();docModal(d.id)}}])}
function docModal(docId){const d=state.docs.find(x=>x.id===docId)||{id:id(),name:'',type:'Guide',folder:'Shared',content:'',updated:now()};openModal(docId?'Edit document':'New document record','<div class="form-grid">'+field('Title','dcName',d.name)+selectField('Type','dcType',d.type,[['Guide','Guide'],['Runbook','Runbook'],['Document','Document'],['Spreadsheet','Spreadsheet'],['Presentation','Presentation'],['File record','File record']])+field('Folder','dcFolder',d.folder)+'<div class="field full"><label for="dcContent">Content / description</label><textarea id="dcContent" style="min-height:180px">'+esc(d.content)+'</textarea></div></div>',[{label:'Save document',cls:'primary',click:()=>{d.name=$('dcName').value.trim();if(!d.name){toast('Title is required');return}d.type=$('dcType').value;d.folder=$('dcFolder').value;d.content=$('dcContent').value;d.updated=now();if(!docId)state.docs.unshift(d);save('Document record saved',d.name);closeModal();render()}}])}
function action(a){if(a.startsWith('goto-'))return setPage(a.slice(5));if(a==='new-event')return eventModal();if(a.startsWith('new-event:'))return eventModal(null,a.split(':')[1]);if(a==='new-ticket')return ticketModal();if(a==='new-product')return productModal();if(a.startsWith('edit-product:'))return productModal(a.split(':')[1]);if(a==='new-person')return personModal();if(a==='new-note')return noteModal();if(a==='new-doc')return docModal();if(a==='new-payment')return paymentModal();if(a==='new-tax')return taxModal();if(a==='new-task'){const title=prompt('Task title');if(title?.trim()){state.tasks.push({id:id(),title:title.trim(),done:false});save('Checklist task created',title);render()}return}if(a==='new-chat')return chatModal();if(a==='new-form')return formModal();if(a.startsWith('form:'))return formPreview(a.split(':')[1]);if(a==='new-workflow')return workflowModal();if(a.startsWith('workflow:'))return workflowDetail(a.split(':')[1]);if(a.startsWith('connector:'))return openModal(a.slice(10),'Connector setup','<div class="notice warn">Credentials and live integration are not configured here. Use the backend integration process; never place secrets in frontend code.</div>',[]);if(a.startsWith('open-doc:'))return openDoc(a.split(':')[1]);if(a==='save-identity'){const s=state.settings;s.orgName=$('sOrg').value.trim()||s.orgName;s.tagline=$('sTag').value;s.displayName=$('sName').value;s.jobTitle=$('sTitle').value;s.department=$('sDept').value;s.email=$('sEmail').value;save('Workspace identity updated');render();toast('Identity saved');return}if(a==='save-appearance'){const s=state.settings;s.theme=$('sTheme').value;s.currency=$('sCurrency').value;s.weekStart=$('sWeek').value;s.fiscalYear=$('sFiscal').value;save('Appearance settings updated');render();toast('Appearance saved');return}if(a==='gear-current')return gearModal(page);if(a==='export-json')return download('intellistack-local-backup.json',JSON.stringify(state,null,2),'application/json');if(a==='export-audit')return download('intellistack-audit.csv','time,actor,action,detail\n'+state.audit.map(x=>[x.time,x.actor,x.action,x.detail].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');if(a==='reset-demo'){if(confirm('Reset the demo data to its original sample? Your local edits will be lost.')){state=structuredClone(defaults);save('Demo data reset');render()}return}if(a==='clear-local'){if(confirm('Clear all local workspace data? This cannot be undone.')){localStorage.removeItem(STORE);state=structuredClone(defaults);render()}return}if(a==='save-editor'){const kind=page,d=state.docs.find(x=>x.id==='editor-'+kind)||{id:'editor-'+kind,type:'Document',folder:'Drafts'};d.name=$('editorTitle').value.trim()||'Untitled';d.content=$('editorContent').value;d.updated=now();if(!state.docs.includes(d))state.docs.unshift(d);save('Editor draft saved',d.name);toast('Draft saved locally');return}if(a==='download-editor')return download(($('editorTitle').value||'draft')+'.txt',$('editorContent').value,'text/plain');if(a==='add-sheet-row'){(state.sheetRows||(state.sheetRows=[])).push({a:'',b:'0',c:''});save('Sheet row added');render();return}if(a==='save-sheet'){state.sheetRows=[...document.querySelectorAll('[data-sheet]')].reduce((arr,el)=>{const i=Number(el.dataset.sheet);arr[i]=arr[i]||{};arr[i][el.dataset.col]=el.value;return arr},[]);save('Sheet saved','IntelliSheets');render();toast('Sheet saved locally');return}if(a==='reset-war'){document.querySelectorAll('[data-war]').forEach(el=>el.checked=false);save('War Room checklist reset');return}if(a==='help')return helpBuddy();if(a==='new-connector')return openModal('Register connector','<div class="notice warn">Connector registration is a planning record only. No credentials are collected or tested by this page.</div>'+field('Connector name','cnName','')+field('Provider','cnProvider',''),[{label:'Save plan',cls:'primary',click:()=>{const n=$('cnName').value.trim();if(n){state.audit.unshift({id:id(),action:'Connector planned',actor:state.settings.displayName,time:now(),detail:n+' / '+$('cnProvider').value});save();closeModal();render()}}}]);}
function paymentModal(){openModal('Record test transaction','<div class="notice warn">This records a local test entry only. No payment is processed.</div><div class="form-grid">'+field('Reference','pmRef','TEST-'+Date.now())+field('Customer','pmCustomer','Demo customer')+field('Amount','pmAmount','25.00','number','min="0" step=".01"')+field('Date','pmDate',dateOffset(0),'date')+'</div>',[{label:'Record test entry',cls:'primary',click:()=>{const amount=Number($('pmAmount').value);if(!(amount>=0)){toast('Enter a valid amount');return}state.payments.unshift({id:id(),ref:$('pmRef').value,customer:$('pmCustomer').value,amount,date:$('pmDate').value,status:'Test recorded'});save('Test payment record added',$('pmRef').value);closeModal();render()}}])}
function taxModal(){openModal('Add tax record','<div class="form-grid">'+field('Tax period','txPeriod',String(new Date().getFullYear()))+selectField('Record type','txKind','Income',[['Income','Income'],['Expense','Expense'],['Deduction note','Deduction note']])+field('Description','txDesc','')+field('Amount','txAmount','0','number','step=".01" min="0"')+'</div>',[{label:'Save record',cls:'primary',click:()=>{const amount=Number($('txAmount').value);if(!(amount>=0)){toast('Enter a valid amount');return}state.taxItems.push({id:id(),period:$('txPeriod').value,kind:$('txKind').value,description:$('txDesc').value,income:$('txKind').value==='Expense'?-amount:amount});save('Tax record added',$('txDesc').value);closeModal();render()}}])}
function chatModal(){openModal('New conversation','<div class="form-grid">'+field('Conversation name','chName','Project room')+selectField('Type','chKind','Channel',[['Channel','Channel'],['Direct message','Direct message'],['Assistant','Assistant']])+'</div>',[{label:'Create conversation',cls:'primary',click:()=>{const name=$('chName').value.trim();if(!name){toast('Name required');return}const c={id:id(),name,kind:$('chKind').value,messages:[]};state.chats.push(c);activeChat=c.id;save('Chat space created',name);closeModal();setPage('chat')}}])}
function formModal(){openModal('Create form','<div class="form-grid">'+field('Form title','fmTitle','New request form')+field('Description','fmDesc','Collect a request')+field('Question label','fmQuestion','What do you need?')+selectField('Answer type','fmType','Long answer',[['Short answer','Short answer'],['Long answer','Long answer'],['Date','Date'],['Yes / No','Yes / No']])+'</div>',[{label:'Save form',cls:'primary',click:()=>{const title=$('fmTitle').value.trim();if(!title){toast('Title required');return}state.forms.push({id:id(),title,description:$('fmDesc').value,question:$('fmQuestion').value,type:$('fmType').value});save('Form created',title);closeModal();render()}}])}
function formPreview(formId){const f=state.forms.find(x=>x.id===formId);if(!f)return;openModal(f.title,'<p>'+esc(f.description)+'</p><div class="field"><label>'+esc(f.question)+'</label><textarea id="formAnswer"></textarea></div>',[{label:'Save local response',cls:'primary',click:()=>{save('Form response captured locally',f.title+': '+$('formAnswer').value);closeModal();toast('Response saved in local audit log')}}])}
function workflowModal(){openModal('New scenario / workflow','<div class="form-grid">'+field('Name','wfName','New response scenario')+selectField('State','wfState','Draft',[['Draft','Draft'],['Ready for tabletop','Ready for tabletop']])+'<div class="field full"><label for="wfSteps">Steps / playbook</label><textarea id="wfSteps">Detect → triage → assign owner → communicate → recover → review</textarea></div></div>',[{label:'Save scenario',cls:'primary',click:()=>{const name=$('wfName').value.trim();if(!name)return;state.workflows.push({id:id(),name,state:$('wfState').value,steps:$('wfSteps').value});save('Scenario created',name);closeModal();render()}}])}
function workflowDetail(wid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;openModal(w.name,'<p>'+esc(w.steps)+'</p><div class="notice warn">Tabletop mode only. This does not trigger real infrastructure actions.</div>',[{label:'Mark ready for tabletop',cls:'primary',click:()=>{w.state='Ready for tabletop';save('Scenario state changed',w.name);closeModal();render()}}])}
function helpBuddy(){openModal('HelpBuddy','<p>What would you like to do?</p><div class="quick-grid">'+[['calendar','Schedule work'],['tickets','Open a ticket'],['knowledge','Find a guide'],['warroom','Run a tabletop']].map(x=>'<button class="quick-card" data-helpgo="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div class="field" style="margin-top:14px"><label for="hbQuestion">Describe what you need</label><textarea id="hbQuestion" placeholder="I need help with…"></textarea></div><p class="small muted">This front-end shell does not call an AI model. Your message will be saved as a local note.</p>',[{label:'Save as note',cls:'primary',click:()=>{const body=$('hbQuestion').value.trim();if(body){state.notes.unshift({id:id(),title:'HelpBuddy request',body,updated:now()});save('HelpBuddy draft saved',body.slice(0,80));closeModal();toast('Saved as a local note')}}}]);$('modalBody').querySelectorAll('[data-helpgo]').forEach(b=>b.onclick=()=>{closeModal();setPage(b.dataset.helpgo)})}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$('sidebar').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');$('globalGear').onclick=()=>setPage('settings');$('helpBtn').onclick=helpBuddy;
$('globalSearch').addEventListener('input',e=>{searchQuery=e.target.value;filterSearch()});$('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase();const match=Object.keys(pageTitles).find(k=>pageTitles[k].toLowerCase().includes(q));if(match)setPage(match);else filterSearch()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('globalSearch').focus()}if(e.key==='Escape'){closeModal();$('sidebar').classList.remove('open')}});
$('modalX').onclick=closeModal;$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});
function init(){try{applySettings();render()}catch(error){console.error('Command Center startup failed:',error);const main=$('main');if(main)main.innerHTML='<section class="card" style="padding:24px"><h1>Command Center could not finish loading</h1><p>The workspace caught a startup error instead of leaving a blank page. Refresh once; if it continues, clear this site\'s stored demo data in browser settings and reopen the deployment.</p><p class="small muted">Diagnostic: '+String(error&&error.message||error).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn primary" onclick="location.reload()">Reload workspace</button><button class="btn" onclick="localStorage.removeItem(\'intellistack.frontend.v1\');location.reload()">Reset local demo data</button></section>'}}init();
})(); 
</script>
</body>
</html>

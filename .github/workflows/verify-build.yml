name: Verify and Build Maximus Optimus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --passWithNoTests

      - name: Build production app
        run: npm run build

      - name: Save production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maximus-optimus-vercel-build
          path: .vercel/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

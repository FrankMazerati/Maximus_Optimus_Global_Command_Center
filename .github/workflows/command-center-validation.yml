name: Command Center Validation
on:
  pull_request:
  push:
    branches:
      - rebuild/full-command-center-experience
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

name: Global Command Center Website Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preview_label:
        description: "Preview label shown in the deployment summary"
        required: false
        default: "Global Command Center"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: global-command-center-pages
  cancel-in-progress: true

jobs:
  publish-preview:
    name: Publish live website preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp app-version.json _site/app-version.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website for publishing
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish live preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report build, deployment, and troubleshooting links
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PREVIEW_LABEL: ${{ inputs.preview_label || 'Global Command Center' }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          PRODUCT_BUILD=$(node -p "require('./app-version.json').productBuild" 2>/dev/null || echo "unknown")
          RELEASE_LABEL=$(node -p "require('./app-version.json').releaseLabel" 2>/dev/null || echo "unknown")
          {
            echo "## ${PREVIEW_LABEL} — website deployment"
            echo
            echo "- **Product build:** ${PRODUCT_BUILD} — ${RELEASE_LABEL}"
            echo "- **Deployment result:** ${DEPLOY_STATUS}"
            echo "- **1. This build/deployment run:** [Run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- **2. Build & QA runs:** [Open validation history](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/command-center-build-qa.yml)"
            echo "- **3. GitHub Pages settings:** [Open publishing settings](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/pages)"
            echo "- **Source commit:** [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA})"
            if [ -n "${PAGE_URL}" ]; then
              echo
              echo "### Published website"
              echo "${PAGE_URL}"
            else
              echo
              echo "No published URL was returned by the deploy step. The current deployment is not confirmed live; use the run link above to inspect the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
